[ado]
org_url = "https://dev.azure.com/<your-org>"
project = "EETS"
repo = "EETS"
ticket_tag = "fixie"
default_base_branch = "dev"
allowlist = []

[claude]
model = "haiku"

[docker]
image = "fixie-agent"
mirror_volume = "fixie-mirror"
gradle_ro_volume = "fixie-gradle-ro"
ticket_timeout_s = 3600
helper_timeout_s = 3600

[orchestrator]
max_attempts = 3
poll_interval_s = 300
max_parallel = 2

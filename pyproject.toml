[project]
name = "fixie"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "markdownify>=1.2.3,<1.3",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a reachable Docker engine and the fixie-agent image"]
